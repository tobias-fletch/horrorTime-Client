<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Horror-Time</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
    // Redirects any deep link (e.g. /horrorTime-Client/movies/123) to index.html
    // with the route encoded in the query string, so BrowserRouter keeps working.
    // pathSegmentsToKeep = 1 because this is a project page served from
    // tobias-fletch.github.io/horrorTime-Client/
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
